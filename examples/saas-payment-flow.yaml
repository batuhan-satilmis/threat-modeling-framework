title: SaaS Payment Flow
scope: |
  Subscribe / cancel / refund flows backed by Stripe. Covers webhook ingestion,
  client-initiated mutations, and the reconciliation between Stripe state and
  application state.

trust_boundaries:
  - id: TB1
    crosses: Anonymous internet → Edge
    trust: none
  - id: TB2
    crosses: Edge → API
    trust: session cookie verified, JWT-derived
  - id: TB3
    crosses: API → DB
    trust: parameterized queries; RLS forced
  - id: TB4
    crosses: Stripe → API webhooks
    trust: signed events only; replay-detected via ledger

threats:
  - id: T-001
    stride: spoofing
    title: Forged webhook events
    description: An attacker without signing-secret access POSTs a fake event to credit a paid plan.
    severity: high
    mitre: [T1190]
    mitigation: |
      Verify Stripe-Signature header on every event using the per-environment
      signing secret. Failed verification → 401, no DB write.
    status: implemented

  - id: T-002
    stride: spoofing
    title: Stripe customer-ID spoof
    description: Client supplies stripe_customer_id directly in subscribe call.
    severity: medium
    mitigation: Server resolves customer ID from session, never from request body.
    status: implemented

  - id: T-003
    stride: tampering
    title: Race two concurrent /subscribe requests
    description: User clicks twice or the network retries; two subscriptions get billed.
    severity: medium
    mitre: [T1078]
    mitigation: |
      Idempotency keys on every payment-creating call. DB unique constraint on
      (tenant_id, stripe_subscription_id). Stripe's own idempotency layer.
    status: implemented

  - id: T-004
    stride: tampering
    title: Modify amount in client request before /subscribe
    description: Client sends arbitrary amount field hoping server uses it.
    severity: high
    mitigation: Amount is server-derived from plan_id; client cannot supply amount.
    status: implemented

  - id: T-005
    stride: repudiation
    title: User claims a refund was unauthorized
    severity: low
    mitigation: |
      Audit log records actor, action, target, before/after. Stripe ledger is
      the independent third-party record.
    status: implemented

  - id: T-006
    stride: information_disclosure
    title: Stripe webhook payloads logged with PII
    description: Default logging captures full webhook bodies with email and partial card data.
    severity: medium
    mitigation: |
      Redact known-sensitive keys before logging. Log event ID and type only;
      look up details from Stripe by ID when needed for debugging.
    status: implemented

  - id: T-007
    stride: denial_of_service
    title: Webhook flood
    description: Attacker floods /webhooks/stripe with unsigned events, exhausting workers.
    severity: low
    mitigation: |
      Edge rate-limit on /webhooks/stripe; signature verification is fast and
      rejects unsigned traffic before any DB hit.
    status: implemented

  - id: T-008
    stride: elevation_of_privilege
    title: Replay successful webhook for another tenant
    description: Attacker captures a legitimate webhook for Tenant A, replays at our endpoint hoping to credit their Tenant B.
    severity: medium
    mitigation: |
      Signed-event ledger keyed by Stripe event ID. Replay → no-op. Webhook handler
      derives tenant from event payload, never from URL or headers.
    status: implemented

  - id: T-009
    stride: tampering
    title: Cancellation in UI never reaches Stripe
    description: User clicks cancel; we mark cancelled locally but the Stripe API call failed silently. We continue to bill them.
    severity: high
    mitigation: |
      Cancellation state transition only after Stripe ack. UI optimistic updates
      rolled back on failure. Daily reconciliation job compares local subscription
      state to Stripe and alerts on drift.
    status: implemented

  - id: T-010
    stride: information_disclosure
    title: Refund webhook leaks customer email to wrong tenant via misrouting
    description: Multi-tenant misrouting based on stripe_customer_id collision.
    severity: critical
    mitigation: |
      Webhook handler enforces (stripe_customer_id, tenant_id) join. Any event
      with a customer ID not owned by exactly one tenant is rejected and alerted.
    status: implemented

  - id: T-011
    stride: tampering
    title: Stale webhook secret accepted after rotation
    description: Old secret continues to verify events for too long after rotation.
    severity: medium
    mitigation: |
      Stripe supports two active signing secrets; old one is removed within 24h
      of rotation in the rotation runbook.
    status: implemented

  - id: T-012
    stride: information_disclosure
    title: Stripe API key written to logs by SDK error path
    description: SDK exception includes Authorization header in some error frames.
    severity: high
    mitigation: |
      Pin Stripe SDK to a version that scrubs Authorization. Application's error
      logger redacts any 'sk_*' prefixed string in stack traces.
    status: implemented

  - id: T-013
    stride: denial_of_service
    title: Card-testing abuse via /subscribe endpoint
    description: |
      Attacker scripts the public /subscribe endpoint with thousands of stolen
      card numbers to identify which ones still authorize. Each failed attempt
      costs Stripe radar fees and risks the merchant being flagged for
      excessive disputes; a successful test then funds card-fraud downstream.
      Unlike T-007 (webhook flood), this hits the legitimate API path with
      well-formed requests and bypasses signature-based filtering.
    severity: high
    mitre: [T1499, T1110]
    mitigation: |
      Stripe Radar with the card-testing rules enabled; per-IP and per-fingerprint
      rate-limit on /subscribe; CAPTCHA after N failed authorisations in a window;
      reject unauthenticated subscribe attempts (require an established account)
      and exponential back-off on consecutive declines.
    status: in_progress

  - id: T-014
    stride: tampering
    title: Webhook signature timestamp tolerance not enforced
    description: |
      The Stripe-Signature header is `t=<ts>,v1=<sig>`. The Stripe SDK's
      constructEvent enforces a default 300-second tolerance against the
      timestamp to defeat replay even with a valid signature. If a developer
      parses the header manually, or passes tolerance=0 / a multi-day value,
      an attacker who exfiltrates a single legitimate event (proxy log,
      mirrored bucket, leaked staging dump) can replay it indefinitely against
      production. Distinct from T-008 — that one is cross-tenant; this one is
      single-tenant temporal replay.
    severity: high
    mitre: [T1565, T1199]
    mitigation: |
      Always go through stripe.webhooks.constructEvent with the default
      tolerance; never hand-roll signature parsing. Add a unit test that asserts
      a 6-minute-old payload with a valid signature is rejected. Pair with the
      signed-event ledger (T-008) so even within tolerance an event can only
      apply once.
    status: implemented

  - id: T-015
    stride: tampering
    title: Coupon redemption race grants stacked discounts
    description: |
      A single-use promo code is enforced by a SELECT-then-INSERT in /apply-coupon.
      An attacker fires N concurrent requests; all N SELECTs see redeemed=0,
      all N INSERTs succeed, and the user lands with N-fold stacked credit.
      The same shape applies to first-month-free trial codes and friend-referral
      bounties.
    severity: medium
    mitre: [T1565]
    mitigation: |
      Make redemption atomic: UNIQUE constraint on (code_id, user_id) plus
      INSERT … ON CONFLICT DO NOTHING, and only honour the credit if the insert
      affected exactly one row. Wrap the Stripe coupon application in the same
      transaction so a failed insert rolls back the Stripe call (or use a
      compensating delete). Audit log every redemption with attempt count and
      IP for forensics.
    status: in_progress

  - id: T-016
    stride: elevation_of_privilege
    title: Billing-portal session URL leaks via Referer or logs
    description: |
      stripe.billingPortal.sessions.create returns a URL of the form
      https://billing.stripe.com/session/BPS_… — that URL is a bearer token.
      Anyone who possesses it during the short session window can cancel
      subscriptions, swap the default payment method, or download invoices
      for the customer, with no additional authentication step against our
      app. Common leak paths in a live SaaS: the merchant app returns the
      URL in a JSON body (ends up in browser history, service-worker cache,
      Sentry breadcrumbs, front-end analytics events); the app 302-redirects
      with the URL in Location but does not set Referrer-Policy, so the
      first navigation off of billing.stripe.com leaks the URL to third
      parties via Referer; a support agent pastes the URL into a Zendesk
      ticket and a second agent opens it a few minutes later. Distinct
      from T-002 (spoofing a Stripe customer ID at the server) and from
      T-008 (server-to-server webhook replay across tenants) — this one
      is a client-facing bearer credential that our app is minting on
      the customer's behalf.
    severity: high
    mitre: [T1539, T1552.001]
    mitigation: |
      Never return the portal URL in a JSON body. The /billing/portal route
      creates the session server-side and issues a 302 Location redirect on
      the same response, with Cache-Control: no-store, private and
      Referrer-Policy: no-referrer set. Mint a fresh session on every hit;
      do not memoize the URL. Validate return_url against an allow-list of
      first-party origins so the merchant app can't be turned into an open
      redirect for the portal round-trip. Strip the `?session=BPS_…` query
      variant from access logs at the reverse-proxy layer (redact anything
      matching /^BPS_[A-Za-z0-9]+$/). Alert on a portal session accessed
      from a country or user-agent that hasn't been seen on the customer's
      account in the last 30 days.
    status: in_progress
